name: Validate Fleet BI Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dashboard requirements
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py ui.py pages tests scripts
      - name: Verify DDS relationships and KPI calculations
        run: python -m unittest discover -s tests -v
